# PostgreSQL local para desarrollo: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: compumundo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: compumundo
      POSTGRES_PASSWORD: compumundo
      POSTGRES_DB: compumundo
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compumundo -d compumundo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
